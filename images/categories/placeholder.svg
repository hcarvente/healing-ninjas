<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="presentation">
  <!-- Transparent background on purpose: the CSS background-color
       of each card shows through, so one file serves six cards. -->
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5"/>
    </pattern>
  </defs>

  <rect width="300" height="200" fill="url(#hatch)"/>

  <circle cx="150" cy="100" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5"/>
  <circle cx="150" cy="100" r="22" fill="#ffffff" fill-opacity="0.35"/>
  <line x1="150" y1="36" x2="150" y2="54" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="146" x2="150" y2="164" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <line x1="86" y1="100" x2="104" y2="100" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <line x1="196" y1="100" x2="214" y2="100" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
</svg>
